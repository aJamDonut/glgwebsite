<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>GreenLabGames | Component Template</title>
  <meta name="description" content="Reusable component template for GreenLabGames pages." />
  <link rel="stylesheet" href="styles.css" />
  <script src="components.js" defer></script>
</head>
<body>
  <glg-nav active="home"></glg-nav>

  <main>
    <header class="shell hero page-hero reveal">
      <div>
        <div class="eyebrow"><span class="pulse"></span> Reusable page scaffold</div>
        <h1 class="page-title">Component-first <span class="gradient-text">template.</span></h1>
        <p class="lead">
          This page is a reference scaffold. Swap text and component attributes to spin up additional pages quickly.
        </p>
        <div class="hero-actions">
          <a class="btn primary" href="projects.html">See projects page</a>
          <a class="btn" href="contact.html">See contact page</a>
        </div>
      </div>
    </header>

    <section class="shell reveal">
      <glg-section-head
        title="Reusable cards"
        description="Use these component tags to build consistent layouts with minimal duplicated markup."
      ></glg-section-head>

      <div class="grid-3">
        <glg-game-card
          title="Game Card Component"
          body="Configured with title, body, and tag attributes."
          tags="Reusable, Card, Component"
        ></glg-game-card>
        <glg-feature-card
          icon="F"
          title="Feature Card Component"
          body="Shared visual style and spacing for studio principles or capabilities."
        ></glg-feature-card>
        <article class="panel">
          <div>
            <h3>Plain Panel</h3>
            <p>Mix components with simple content blocks when you need custom layout control.</p>
          </div>
        </article>
      </div>
    </section>

    <glg-newsletter></glg-newsletter>
  </main>

  <glg-footer></glg-footer>
</body>
</html>
